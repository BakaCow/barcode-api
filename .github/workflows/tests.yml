name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-research.txt
      - run: python -m pytest -q
      - run: python tools/export-openapi.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - name: Check client and scanner TypeScript declarations
        run: npm exec --yes --package=typescript@5.9.3 -- tsc --strict --noEmit --lib ES2022,DOM --module NodeNext --moduleResolution NodeNext tests/client-types.mts
      - name: Build the React integration example
        working-directory: examples/react
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Benchmark the Code 128 development examples
        run: node tools/benchmark-code128.mjs --fixtures data/synthetic/dev-pixels.json --output benchmark-results/ci-code128.json
      - name: Benchmark damaged development images
        run: |
          node tools/benchmark-accuracy.mjs --corpus tests/fixtures/damage-stress-dev.json --output benchmark-results/ci-damage-browser.json
          python tools/benchmark-damage-api.py --corpus tests/fixtures/damage-stress-dev.json --output benchmark-results/ci-damage-api.json
          node tools/benchmark-damage-custom.mjs --corpus tests/fixtures/damage-stress-dev.json --output benchmark-results/ci-damage-custom.json
