[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "barcode-api-client"
version = "0.8.0"
description = "Standard-library Python client for this Barcode API deployment"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["barcode_api_client*"]
